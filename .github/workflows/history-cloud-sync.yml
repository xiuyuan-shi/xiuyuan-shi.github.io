name: Mirror cloud history data
run-name: ${{ inputs.automatic && format('Cloud history after {0}', inputs.parent_run) || inputs.arm_only && 'Cloud history timer initialization' || format('Cloud history {0}', github.event_name) }}
on:
  schedule:
    - cron: '3/5 * * * *'
  workflow_dispatch:
    inputs:
      arm_only:
        description: Initialize the cloud timer without mirroring data
        type: boolean
        default: false
      automatic:
        description: Started by the preceding cloud run
        type: boolean
        default: false
      parent_run:
        description: Previous cloud run ID for audit
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: history-cloud-sync
  cancel-in-progress: false
jobs:
  synchronize:
    if: ${{ !inputs.arm_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloud-history-timer
    permissions:
      contents: write
    outputs:
      data_changed: ${{ steps.mirror.outputs.data_changed }}
      data_commit: ${{ steps.mirror.outputs.data_commit }}
    steps:
      - name: Checkout data tooling and version state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/
            /content/store/frontend.schema.json
            /api/history/version.json
            /public-release.json
            /github-pages-release.json
          sparse-checkout-cone-mode: false
      - name: Read private cloud database and mirror its public projection
        id: mirror
        env:
          HISTORY_CLOUD_ACCESS_TOKEN: ${{ secrets.HISTORY_CLOUD_ACCESS_TOKEN }}
          HISTORY_CLOUD_SYNC_TOKEN: ${{ secrets.HISTORY_CLOUD_SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/history_cloud_mirror.py
  deploy:
    if: needs.synchronize.outputs.data_changed == 'true'
    needs: synchronize
    runs-on: ubuntu-latest
    concurrency:
      group: history-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the latest frontend and mirrored cloud data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Verify and package current frontend with public data
        run: python3 .github/scripts/package_site.py _site
      - name: Upload verified public artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
      - name: Deploy data update without building the frontend
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
  arm-next:
    if: ${{ always() && !cancelled() }}
    needs: [synchronize, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Schedule the next cloud run with this job's temporary token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' | gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/history-cloud-sync.yml/dispatches" --input -
          import json, os
          print(json.dumps({'ref': 'main', 'inputs': {'automatic': True, 'parent_run': os.environ['GITHUB_RUN_ID']}}))
          PY
